services:
  - type: web
    name: student-feedback-sentiment
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('stopwords')"
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TF_USE_LEGACY_KERAS
        value: "1"
